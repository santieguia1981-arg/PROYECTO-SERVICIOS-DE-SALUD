<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consultas del catálogo · Customer Service</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px/1.5 Arial,sans-serif;color:#183137;background:#f5f9f9}main{max-width:960px;margin:auto;padding:22px}h1{margin:0;font-size:24px}h2{font-size:18px;margin:0}p{margin:.4rem 0 .8rem}section,article{background:white;border:1px solid #cee1df;border-radius:12px;padding:18px;margin:12px 0}label{display:block;margin:8px 0;font-weight:600}input{width:min(100%,440px);padding:10px;border:1px solid #758e91;border-radius:6px;font-size:16px}button{background:#116458;border:0;color:white;padding:10px 15px;margin:5px 5px 5px 0;border-radius:6px;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.quiet{background:#eef4f3;color:#204b47}.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.detail{white-space:pre-wrap;overflow-wrap:anywhere}.meta{color:#48666a;font-size:14px}.ticket{color:#106457;overflow-wrap:anywhere;font-size:13px}#feedback:empty{display:none}ul{padding-left:20px}li{margin:6px 0}[hidden]{display:none!important}
  </style>
  <script type="module" src="/bandeja-consultas.js"></script>
</head>
<body><main>
  <h1 id="title">Consultas del catálogo</h1>
  <section id="login" hidden>
    <p>Ingresá con el acceso personal que te entregó quien administra Customer Service.</p>
    <form id="loginForm">
      <label for="accessKey">Clave de acceso personal</label>
      <input id="accessKey" type="password" autocomplete="current-password" required>
      <button>Ver mis consultas</button>
    </form>
  </section>
  <section id="inbox" hidden>
    <div class="row"><h2 id="count"></h2><div><button id="refresh" class="quiet">Actualizar</button><button id="logout" class="quiet">Cerrar sesión</button></div></div>
    <div id="messages"></div>
  </section>
  <section id="admin" hidden>
    <form id="inviteForm"><label for="label">Nombre o correo de la persona autorizada</label><input id="label" required maxlength="180" autocomplete="off"> <button>Crear acceso personal</button></form>
    <div id="newAccess" hidden><label for="newKey">Clave para entregar a esa persona</label><input id="newKey" type="password" readonly autocomplete="off"> <button id="copy">Copiar clave</button></div>
    <h2>Personas autorizadas</h2><ul id="operators"></ul>
  </section>
  <p role="status" aria-live="polite" id="feedback"></p>
</main></body></html>
